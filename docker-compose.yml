# Local dev only. Production service lives in ~/apps/docker-compose.yml on the server.
# Requires the shared postgres: run `docker compose up -d` from web/ first.
name: money-tracker
services:
  web:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port 5004"
    ports:
      - "5004:5004"
    env_file: backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg2://money_tracker:money_tracker@postgres:5432/money_tracker
    restart: on-failure

networks:
  default:
    name: web
    external: true
